<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 184" width="960" height="184" role="img" aria-label="Dynamic Fenn notch tile layouts across small, wide, multi-account, and large card sizes">
  <defs>
    <linearGradient id="tBg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1b1f27"/>
      <stop offset="100%" stop-color="#13161d"/>
    </linearGradient>
  </defs>

  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
    <rect width="960" height="184" rx="18" fill="#0d1016" stroke="#ffffff" stroke-opacity="0.09"/>

    <!-- 1. Small Tile -->
    <g transform="translate(22, 18)">
      <rect width="140" height="118" rx="16" fill="url(#tBg)" stroke="#ffffff" stroke-opacity="0.12"/>
      <path d="M 44 76 A 32 32 0 1 1 96 76" fill="none" stroke="#ffffff" stroke-opacity="0.12" stroke-width="5" stroke-linecap="round"/>
      <path d="M 44 76 A 32 32 0 1 1 98 52" fill="none" stroke="#d97757" stroke-width="5" stroke-linecap="round"/>
      <text x="70" y="62" text-anchor="middle" fill="#f2f4f8" font-size="20" font-weight="700">77</text>
      <text x="70" y="86" text-anchor="middle" fill="#8c95a6" font-size="10">+2</text>
      <text x="70" y="104" text-anchor="middle" fill="#9ea6b5" font-size="10">Claude</text>
      <text x="70" y="144" text-anchor="middle" fill="#a2aab8" font-size="11.5" font-weight="600">Small tile (tightest)</text>
    </g>

    <!-- 2. Wide (1 link) -->
    <g transform="translate(184, 18)">
      <rect width="234" height="118" rx="16" fill="url(#tBg)" stroke="#ffffff" stroke-opacity="0.12"/>
      <polygon points="24,18 30,31 27.5,31 24,23.5 20.5,31 18,31" fill="#5b6eff"/>
      <text x="38" y="29" fill="#f2f4f8" font-size="12.5" font-weight="700">Antigravity · used</text>

      <text x="20" y="70" fill="#d3d9e3" font-size="11" font-weight="600">Gem 5h 30%</text>
      <rect x="20" y="82" width="90" height="5" rx="2.5" fill="#ffffff" fill-opacity="0.12"/>
      <rect x="20" y="82" width="27" height="5" rx="2.5" fill="#5b6eff"/>

      <text x="124" y="70" fill="#d3d9e3" font-size="11" font-weight="600">Gem 7d 31%</text>
      <rect x="124" y="82" width="90" height="5" rx="2.5" fill="#ffffff" fill-opacity="0.12"/>
      <rect x="124" y="82" width="28" height="5" rx="2.5" fill="#5b6eff"/>

      <text x="117" y="144" text-anchor="middle" fill="#a2aab8" font-size="11.5" font-weight="600">Wide tile (1 account)</text>
    </g>

    <!-- 3. Wide (3 links) -->
    <g transform="translate(440, 18)">
      <rect width="248" height="118" rx="16" fill="url(#tBg)" stroke="#ffffff" stroke-opacity="0.12"/>
      <g transform="translate(14, 24)">
        <text x="34" y="14" text-anchor="middle" fill="#8b94a5" font-size="10.5">Claude</text>
        <text x="34" y="42" text-anchor="middle" fill="#f2f4f8" font-size="15.5" font-weight="700">37%</text>
        <rect x="6" y="58" width="56" height="5" rx="2.5" fill="#ffffff" fill-opacity="0.12"/>
        <rect x="6" y="58" width="21" height="5" rx="2.5" fill="#d97757"/>
      </g>
      <g transform="translate(90, 24)">
        <text x="34" y="14" text-anchor="middle" fill="#8b94a5" font-size="10.5">ChatGPT</text>
        <text x="34" y="42" text-anchor="middle" fill="#f2f4f8" font-size="15.5" font-weight="700">0%</text>
        <rect x="6" y="58" width="56" height="5" rx="2.5" fill="#ffffff" fill-opacity="0.12"/>
      </g>
      <g transform="translate(166, 24)">
        <text x="34" y="14" text-anchor="middle" fill="#8b94a5" font-size="10.5">Antigravity</text>
        <text x="34" y="42" text-anchor="middle" fill="#f2f4f8" font-size="15.5" font-weight="700">31%</text>
        <rect x="6" y="58" width="56" height="5" rx="2.5" fill="#ffffff" fill-opacity="0.12"/>
        <rect x="6" y="58" width="18" height="5" rx="2.5" fill="#5b6eff"/>
      </g>
      <text x="124" y="144" text-anchor="middle" fill="#a2aab8" font-size="11.5" font-weight="600">Wide tile (2 to 3 accounts)</text>
    </g>

    <!-- 4. Large 2x2+ Tile -->
    <g transform="translate(710, 18)">
      <rect width="228" height="118" rx="16" fill="url(#tBg)" stroke="#ffffff" stroke-opacity="0.12"/>
      <text x="16" y="24" fill="#8b94a5" font-size="10" font-weight="700">AI Usage</text>
      <text x="212" y="24" text-anchor="end" fill="#757e90" font-size="9.5">% used</text>

      <!-- Row 1 -->
      <rect x="16" y="34" width="10" height="7" rx="1.5" fill="#d97757"/>
      <text x="32" y="41" fill="#f2f4f8" font-size="11" font-weight="600">Claude</text>
      <text x="212" y="41" text-anchor="end" fill="#f2f4f8" font-size="11" font-weight="700">37%</text>
      <rect x="16" y="47" width="196" height="3.5" rx="1.75" fill="#ffffff" fill-opacity="0.12"/>
      <rect x="16" y="47" width="72" height="3.5" rx="1.75" fill="#d97757"/>

      <!-- Row 2 -->
      <circle cx="21" cy="67" r="4.5" fill="#10a37f" fill-opacity="0.25" stroke="#10a37f" stroke-width="1.2"/>
      <text x="32" y="70" fill="#f2f4f8" font-size="11" font-weight="600">ChatGPT</text>
      <text x="212" y="70" text-anchor="end" fill="#f2f4f8" font-size="11" font-weight="700">0%</text>
      <rect x="16" y="76" width="196" height="3.5" rx="1.75" fill="#ffffff" fill-opacity="0.12"/>

      <!-- Row 3 -->
      <polygon points="21,91 25,100 23,100 21,95.5 19,100 17,100" fill="#5b6eff"/>
      <text x="32" y="99" fill="#f2f4f8" font-size="11" font-weight="600">Antigravity</text>
      <text x="212" y="99" text-anchor="end" fill="#f2f4f8" font-size="11" font-weight="700">31%</text>
      <rect x="16" y="105" width="196" height="3.5" rx="1.75" fill="#ffffff" fill-opacity="0.12"/>
      <rect x="16" y="105" width="60" height="3.5" rx="1.75" fill="#5b6eff"/>

      <text x="114" y="144" text-anchor="middle" fill="#a2aab8" font-size="11.5" font-weight="600">Large tile (2x2+)</text>
    </g>
  </g>
</svg>
